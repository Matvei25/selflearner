<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Марк — веб-чат</title>
<style>
  :root{ --bg:#0d1117; --panel:#161b22; --border:#30363d;
         --accent:#22d3ee; --us:#2f6fed; --mk:#1f2a3a; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:#e6edf3; font-family:system-ui,Segoe UI,Roboto,sans-serif; }
  .app{ max-width:760px; margin:0 auto; height:100vh; display:flex; flex-direction:column; }
  header{ padding:14px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
  .logo{ width:34px; height:34px; border-radius:9px; background:var(--accent);
         display:grid; place-items:center; color:#0d1117; font-weight:800; }
  header h1{ font-size:18px; margin:0; }
  header .dot{ width:8px; height:8px; border-radius:50%; background:#22c55e; display:inline-block; margin-left:auto; }
  .chat{ flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px; }
  .msg{ max-width:78%; padding:10px 13px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; line-height:1.45; }
  .msg.user{ align-self:flex-end; background:var(--us); border-bottom-right-radius:4px; }
  .msg.mark{ align-self:flex-start; background:var(--mk); border:1px solid var(--border); border-bottom-left-radius:4px; }
  .msg.sys{ align-self:center; background:transparent; color:#8b949e; font-size:12px; }
  footer{ border-top:1px solid var(--border); padding:12px 14px; display:flex; gap:8px; }
  #in{ flex:1; background:var(--panel); border:1px solid var(--border); color:#e6edf3;
       padding:11px 13px; border-radius:10px; font:inherit; outline:none; }
  #in:focus{ border-color:var(--accent); }
  button{ background:var(--accent); color:#0d1117; border:none; padding:0 20px; border-radius:10px;
          font:inherit; font-weight:700; cursor:pointer; }
  button:hover{ filter:brightness(1.1); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">М</div>
    <h1>Марк — самому себя растит</h1>
    <span class="dot" title="онлайн"></span>
  </header>
  <div class="chat" id="chat">
    <div class="msg sys">Марк онлайн. Пиши — он учится на каждом сообщении. (персона имя) — включить персонажа.</div>
  </div>
  <footer>
    <input id="in" placeholder="напиши Марку..." autocomplete="off">
    <button id="go">→</button>
  </footer>
</div>
<script>
const chat=document.getElementById('chat'), inp=document.getElementById('in');
function add(who,text){
  const d=document.createElement('div'); d.className='msg '+who; d.textContent=text;
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight; return d;
}
async function send(e){
  if(e && e.key && e.key!=='Enter') return;
  const msg=inp.value.trim(); if(!msg) return;
  inp.value=''; add('user',msg);
  const d=add('mark','…');           // временная "думает"
  try{
    const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},
                 body:JSON.stringify({msg})});
    const j=await r.json();
    d.textContent=j.reply || '(пусто)';
  }catch(err){ d.textContent='(связь упала: '+err+')'; }
  chat.scrollTop=chat.scrollHeight;
}
inp.addEventListener('keydown', send);
document.getElementById('go').addEventListener('click', send);
inp.focus();
</script>
</body>
</html>
